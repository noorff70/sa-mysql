#default port where the service will be started
server:
  port: 8082 

#tells about the Eureka server details and its refresh time 
eureka:     
  instance:
    preferIpAddress: true 
  client:
    serviceUrl:
      # localhost
       defaultZone: http://localhost:8761/eureka/
      # docker
      # defaultZone: http://sa-discovery:8761/eureka/
 
spring:   
  application:
    name: sa-mysql   #current service name to be used by the eureka server
  datasource:
    #driverClassName: com.mysql.cj.jdbc.Driver
    # Credentials come from environment variables, never from this file.
    #   STUDYAID_DB_PASSWORD  required - password of the MySQL app user
    #   STUDYAID_DB_USER      optional - defaults to the app user "studyaid"
    #   STUDYAID_DB_URL       optional - in Docker use jdbc:mysql://host.docker.internal:3306/studyaid
    # studyaid-schema\create-app-db-user.ps1 creates the user and can set the variables.
    jdbc-url: ${STUDYAID_DB_URL:jdbc:mysql://localhost:3306/studyaid}
    username: ${STUDYAID_DB_USER:studyaid}
    password: ${STUDYAID_DB_PASSWORD}

    
management:
  security:
    enabled: false  #disable the spring security on the management endpoints like /env, /refresh etc. 
    

